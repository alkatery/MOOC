{% extends "base.html" %}
{% block title %}{{ page.title_ar }}{% endblock %}
{% block content %}
<section class="container container-narrow mt-4">
  <article class="card prose">
    <h1>{{ page.title_ar }}</h1>
    <div>{{ page.body_html | safe }}</div>
    <p class="muted small mt-3">آخر تحديث: {{ page.updated_at.strftime("%Y-%m-%d") }}</p>
  </article>
</section>
{% endblock %}
