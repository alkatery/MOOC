[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mooc-platform"
version = "0.1.0"
description = "منصة المساقات المفتوحة — Arabic-first MOOC platform aligned with Saudi Arabia's NELC e-Learning Excellence Standards."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "alkatery" }]
keywords = [
    "mooc",
    "elearning",
    "nelc",
    "saudi-arabia",
    "arabic",
    "fastapi",
    "scorm",
    "xapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic[email]>=2.7",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
mooc-platform = "mooc.__main__:main"

[project.urls]
Homepage = "https://github.com/alkatery/MOOC"
Issues = "https://github.com/alkatery/MOOC/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mooc = ["templates/**/*.html", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
