# /etc/nginx/sites-available/larning.alkathiri.net
# Symlink:  ln -s /etc/nginx/sites-available/larning.alkathiri.net /etc/nginx/sites-enabled/
# Reload :  nginx -t && systemctl reload nginx
#
# This file proxies https://larning.alkathiri.net to the gunicorn
# unix-socket served by the `larning.service` systemd unit.
# The HTTP→HTTPS redirect block + the Let's Encrypt block are added
# automatically by `certbot --nginx`. Run that AFTER the first HTTP-only
# load works, then nginx will end up with both server { listen 80; }
# (auto-redirect) and server { listen 443 ssl; } blocks.

upstream larning_app {
    server unix:/run/larning.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name larning.alkathiri.net;

    # Allow Let's Encrypt HTTP-01 challenge BEFORE certbot rewrites this file.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Until certbot adds its redirect, fall through to the app.
    location / {
        proxy_pass         http://larning_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Tenant-Slug     "default";   # override per-subdomain if multi-tenant
        proxy_redirect     off;
        proxy_read_timeout 90s;
        client_max_body_size 200M;            # SCORM packages, course media

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/html;
    }

    # Static assets (CSS, course media uploads) — served directly by nginx.
    location /static/ {
        alias /var/www/larning.alkathiri.net/src/mooc/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # User uploads / SCORM packages / certificates (MOOC_DATA_DIR/uploads).
    location /uploads/ {
        alias /var/www/larning.alkathiri.net/var/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Strict no-cache for the app HTML; FastAPI sets its own headers anyway.
    location ~* \.(?:html)$ {
        proxy_pass         http://larning_app;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Security headers (some are also set by FastAPI; nginx-level for defense-in-depth)
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    access_log /var/log/nginx/larning.access.log;
    error_log  /var/log/nginx/larning.error.log warn;
}
